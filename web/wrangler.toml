name = "rcade"
compatibility_date = "2024-11-25"
main = ".svelte-kit/cloudflare/_worker.js"
account_id = "9aee291c8fc8a03f6dacc66454177c60"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "rcade.dev"
custom_domain = true

[vars]
BUCKET_S3_ENDPOINT = "https://9aee291c8fc8a03f6dacc66454177c60.r2.cloudflarestorage.com/rcade"

[build]
command = "pnpm exec vite build"

[assets]
directory = ".svelte-kit/cloudflare/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rcade"
database_id = "c74c6e00-e3b7-4f18-aad1-76fa8b901d6c"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "STORE"
bucket_name = "rcade"

# Rate limiting binding (open beta, hence "unsafe"). Limits POST /api/v1/events/auth
# to 10 requests per 60s per client IP. namespace_id is an arbitrary account-unique id.
[[unsafe.bindings]]
name = "EVENT_AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
